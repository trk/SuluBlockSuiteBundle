tabs:
  general:
    title:
      en: General
      tr: Genel
      de: Allgemein
      ru: Общие
      es: General
      fr: Général
    fields:
      margin_top:
        type: select
        label:
          en: 'Margin Top'
          tr: 'Üst Boşluk'
          de: 'Abstand Oben'
          ru: 'Отступ сверху'
          es: 'Margen Superior'
          fr: 'Marge Supérieure'
        col_span: 6
        options:
          - { value: none, label: { en: 'None', tr: 'Yok', de: 'Keine', ru: 'Нет', es: 'Ninguno', fr: 'Aucun' } }
          - { value: xs, label: { en: 'Extra Small', tr: 'Çok Küçük', de: 'Extra Klein', ru: 'Очень малый', es: 'Extra Pequeño', fr: 'Très Petit' } }
          - { value: sm, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: 'Medium', tr: 'Orta', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
          - { value: auto, label: { en: Auto, tr: Otomatik, de: Auto, ru: Авто, es: Auto, fr: Auto } }
      margin_bottom:
        type: select
        label:
          en: 'Margin Bottom'
          tr: 'Alt Boşluk'
          de: 'Abstand Unten'
          ru: 'Отступ снизу'
          es: 'Margen Inferior'
          fr: 'Marge Inférieure'
        col_span: 6
        options:
          - { value: none, label: { en: 'None', tr: 'Yok', de: 'Keine', ru: 'Нет', es: 'Ninguno', fr: 'Aucun' } }
          - { value: xs, label: { en: 'Extra Small', tr: 'Çok Küçük', de: 'Extra Klein', ru: 'Очень малый', es: 'Extra Pequeño', fr: 'Très Petit' } }
          - { value: sm, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: 'Medium', tr: 'Orta', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
          - { value: auto, label: { en: Auto, tr: Otomatik, de: Auto, ru: Авто, es: Auto, fr: Auto } }
      text_align:
        type: select
        label:
          en: 'Text Alignment'
          tr: 'Metin Hizalama'
          de: Textausrichtung
          ru: 'Выравнивание текста'
          es: 'Alineación de Texto'
          fr: 'Alignement du Texte'
        col_span: 6
        options:
          - { value: left, label: { en: Left, tr: 'Sola Hizalı', de: Links, ru: 'По левому краю', es: Izquierda, fr: Gauche } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: right, label: { en: Right, tr: 'Sağa Hizalı', de: Rechts, ru: 'По правому краю', es: Derecha, fr: Droite } }
          - { value: justify, label: { en: Justify, tr: 'İki Yana Yasla', de: Blocksatz, ru: 'По ширине', es: Justificar, fr: Justifier } }
      position:
        type: select
        label:
          en: Position
          tr: 'Konum'
          de: Position
          ru: Позиция
          es: Posición
          fr: Position
        col_span: 6
        options:
          - { value: static, label: { en: 'Static', tr: 'Statik', de: Statisch, ru: Статическая, es: Estático, fr: Statique } }
          - { value: relative, label: { en: Relative, tr: 'Göreceli', de: Relativ, ru: Относительная, es: Relativo, fr: Relative } }
          - { value: sticky, label: { en: 'Sticky', tr: 'Yapışkan', de: 'Sticky', ru: 'Липкая', es: 'Fijo al desplazarse', fr: 'Collant' } }
      max_width:
        type: select
        label:
          en: 'Max Width'
          tr: 'Maksimum Genişlik'
          de: 'Maximale Breite'
          ru: 'Максимальная ширина'
          es: 'Ancho Máximo'
          fr: 'Largeur Maximale'
        col_span: 6
        options:
          - { value: none, label: { en: None, tr: Sınırsız, de: Keine, ru: 'Без ограничений', es: Ninguno, fr: Aucun } }
          - { value: small, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малая', es: 'Pequeño', fr: 'Petit' } }
          - { value: medium, label: { en: 'Medium', tr: 'Orta', de: 'Mittel', ru: 'Средняя', es: 'Mediano', fr: 'Moyen' } }
          - { value: large, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большая', es: 'Grande', fr: 'Grand' } }
          - { value: xlarge, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большая', es: 'Extra Grande', fr: 'Très Grand' } }
          - { value: 2xlarge, label: { en: '2X Large', tr: 'Ekstra Büyük', de: '2X Groß', ru: '2X Большая', es: '2X Grande', fr: '2X Grand' } }
      block_align:
        type: select
        label:
          en: 'Block Alignment'
          tr: 'Blok Hizalama'
          de: Blockausrichtung
          ru: 'Выравнивание блока'
          es: 'Alineación del Bloque'
          fr: 'Alignement du Bloc'
        col_span: 6
        options:
          - { value: left, label: { en: Left, tr: Sola, de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: right, label: { en: Right, tr: Sağa, de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
      animation:
        type: select
        label:
          en: Animation
          tr: Animasyon
          de: Animation
          ru: Анимация
          es: Animación
          fr: Animation
        col_span: 6
        options:
          - { value: none, label: { en: None, tr: Yok, de: Keine, ru: Нет, es: Ninguna, fr: Aucune } }
          - { value: fade, label: { en: 'Fade In', tr: 'Belirme', de: Einblenden, ru: 'Плавное появление', es: 'Aparecer', fr: 'Fondu' } }
          - { value: slide-up, label: { en: 'Slide Up', tr: 'Aşağıdan Yukarı', de: 'Nach oben gleiten', ru: 'Снизу вверх', es: 'Deslizar hacia arriba', fr: 'Glisser vers le haut' } }
          - { value: slide-down, label: { en: 'Slide Down', tr: 'Yukarıdan Aşağı', de: 'Nach unten gleiten', ru: 'Сверху вниз', es: 'Deslizar hacia abajo', fr: 'Glisser vers le bas' } }
          - { value: zoom-in, label: { en: 'Zoom In', tr: 'Yakınlaşarak', de: Heranzoomen, ru: 'Увеличение', es: 'Acercar', fr: 'Zoom avant' } }
      visibility:
        type: select
        label:
          en: Visibility
          tr: Görünürlük
          de: Sichtbarkeit
          ru: Видимость
          es: Visibilidad
          fr: Visibilité
        col_span: 6
        options:
          - { value: all, label: { en: 'Always Visible', tr: 'Her Zaman Görünür', de: 'Immer sichtbar', ru: 'Всегда видимо', es: 'Siempre visible', fr: 'Toujours visible' } }
          - { value: hidden_sm, label: { en: 'Hidden on Mobile', tr: 'Mobilde Gizle', de: 'Auf Mobilgeräten ausblenden', ru: 'Скрыть на мобильных', es: 'Oculto en móvil', fr: 'Masqué sur mobile' } }
          - { value: hidden_md, label: { en: 'Hidden on Tablet & Below', tr: 'Tablet ve Altında Gizle', de: 'Bis Tablet ausblenden', ru: 'Скрыть на планшетах', es: 'Oculto en tablet', fr: 'Masqué sur tablette' } }
          - { value: visible_sm, label: { en: 'Mobile Only', tr: 'Sadece Mobil', de: 'Nur Mobil', ru: 'Только мобильные', es: 'Solo móvil', fr: 'Mobile uniquement' } }
  advanced:
    title:
      en: Advanced
      tr: Gelişmiş
      de: Erweitert
      ru: Расширенные
      es: Avanzado
      fr: Avancé
    fields:
      name:
        type: text
        label:
          en: Name
          tr: 'Öğe Adı'
          de: Name
          ru: Название
          es: Nombre
          fr: Nom
        placeholder:
          en: 'e.g. Hero Section, Featured Story'
          tr: 'örn. Hero Bölümü, Öne Çıkanlar'
          de: 'z.B. Hero-Bereich, Hauptbeitrag'
          ru: 'напр. Главный баннер, Избранное'
          es: 'ej. Sección Hero, Historia Destacada'
          fr: 'ex. Section Héro, Article à la une'
        col_span: 12
      id:
        type: text
        label:
          en: 'HTML Element ID'
          tr: 'HTML Eleman Kimliği'
          de: 'HTML-Element-ID'
          ru: 'ID HTML-элемента'
          es: 'ID del Elemento HTML'
          fr: 'ID de l''élément HTML'
        placeholder:
          en: 'e.g. hero-cta, features-block'
          tr: 'örn. hero-cta, features-block'
          de: 'z.B. hero-cta, features-block'
          ru: 'напр. hero-cta, features-block'
          es: 'ej. hero-cta, features-block'
          fr: 'ex. hero-cta, features-block'
        col_span: 6
      class:
        type: text
        label:
          en: 'Custom CSS Classes'
          tr: 'Özel CSS Sınıfları'
          de: 'Benutzerdefinierte CSS-Klassen'
          ru: 'Пользовательские CSS-классы'
          es: 'Clases CSS Personalizadas'
          fr: 'Classes CSS Personnalisées'
        placeholder:
          en: 'e.g. hero-banner custom-section'
          tr: 'örn. hero-banner custom-section'
          de: 'z.B. hero-banner custom-section'
          ru: 'напр. hero-banner custom-section'
          es: 'ej. hero-banner custom-section'
          fr: 'ex. hero-banner custom-section'
        col_span: 6
      attributes:
        type: textarea
        label:
          en: Attributes
          tr: 'Öznitelikler'
          de: Attribute
          ru: Атрибуты
          es: Atributos
          fr: Attributs
        placeholder:
          en:"e.g. data-aos=fade-up\naria-label=\"Banner\""
          tr:"örn. data-aos=fade-up\naria-label=\"Açıklama\""
          de:"z.B. data-aos=fade-up\naria-label=\"Banner\""
          ru:"напр. data-aos=fade-up\naria-label=\"Баннер\""
          es:"ej. data-aos=fade-up\naria-label=\"Banner\""
          fr:"ex. data-aos=fade-up\naria-label=\"Bannière\""
        col_span: 12
      css:
        type: textarea
        label:
          en: 'Custom CSS'
          tr: 'Özel CSS'
          de: 'Benutzerdefiniertes CSS'
          ru: 'Пользовательский CSS'
          es: 'CSS Personalizado'
          fr: 'CSS Personnalisé'
        placeholder:
          en: 'e.g. .el-element ''{'' border-radius: 1rem; ''}'''
          tr: 'örn. .el-element ''{'' border-radius: 1rem; ''}'''
          de: 'z.B. .el-element ''{'' border-radius: 1rem; ''}'''
          ru: 'напр. .el-element ''{'' border-radius: 1rem; ''}'''
          es: 'ej. .el-element ''{'' border-radius: 1rem; ''}'''
          fr: 'ex. .el-element ''{'' border-radius: 1rem; ''}'''
        col_span: 12

