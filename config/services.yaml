services:
    _defaults:
        autowire: true
        autoconfigure: true

    Totoglu\SuluBlockSuiteBundle\Preset\MediaPreviewUrlResolver:
        arguments:
            $mediaManager: '@?sulu_media.media_manager'

    Totoglu\SuluBlockSuiteBundle\Preset\BlockPresetProviderInterface:
        alias: Totoglu\SuluBlockSuiteBundle\Preset\YamlBlockPresetProvider

    Totoglu\SuluBlockSuiteBundle\Preset\YamlBlockPresetProvider:
        arguments:
            $yamlDirectory: '%sulu_block_suite.presets.yaml_dir%'
            $translator: '@?translator'
            $snippetRepository: '@?sulu_snippet.snippet_repository'
            $enableSnippetPresets: '%sulu_block_suite.presets.enable_snippet_presets%'
            $mediaManager: '@?sulu_media.media_manager'
            $mediaPreviewUrlResolver: '@Totoglu\SuluBlockSuiteBundle\Preset\MediaPreviewUrlResolver'

    Totoglu\SuluBlockSuiteBundle\Schema\BlockPropSchemaProviderInterface:
        alias: Totoglu\SuluBlockSuiteBundle\Schema\YamlBlockPropSchemaProvider

    Totoglu\SuluBlockSuiteBundle\Schema\YamlBlockPropSchemaProvider:
        arguments:
            $schemaDirectory: '%sulu_block_suite.props.schema_dir%'
            $translator: '@?translator'

    Totoglu\SuluBlockSuiteBundle\Controller\Admin\BlockPresetController:
        arguments:
            $presetProvider: '@Totoglu\SuluBlockSuiteBundle\Preset\BlockPresetProviderInterface'
            $snippetRepository: '@?sulu_snippet.snippet_repository'
            $mediaManager: '@?sulu_media.media_manager'
            $schemaProvider: '@Totoglu\SuluBlockSuiteBundle\Schema\BlockPropSchemaProviderInterface'
            $targetBlockVisitor: '@Totoglu\SuluBlockSuiteBundle\Metadata\TargetBlockOptionsFormMetadataVisitor'
            $messageBus: '@?Symfony\Component\Messenger\MessageBusInterface'
            $securityChecker: '@?sulu_security.security_checker'
            $mediaPreviewUrlResolver: '@Totoglu\SuluBlockSuiteBundle\Preset\MediaPreviewUrlResolver'
        tags: ['controller.service_arguments']

    Totoglu\SuluBlockSuiteBundle\Layout\LayoutResolverInterface:
        alias: Totoglu\SuluBlockSuiteBundle\Layout\LayoutResolver

    Totoglu\SuluBlockSuiteBundle\Layout\LayoutResolver:
        arguments:
            $mappings: '%sulu_block_suite.layout.mappings%'

    Totoglu\SuluBlockSuiteBundle\Layout\PageLayoutProviderInterface:
        alias: Totoglu\SuluBlockSuiteBundle\Layout\PageLayoutProvider

    Totoglu\SuluBlockSuiteBundle\Layout\PageLayoutProvider:
        arguments:
            $snippetRepository: '@?sulu_snippet.snippet_repository'
            $twig: '@?twig'
            $requestStack: '@?request_stack'
            $layoutsDirectory: '%sulu_block_suite.layout.yaml_dir%'
            $referenceStore: '@?sulu_http_cache.reference_store'

    Totoglu\SuluBlockSuiteBundle\Twig\LayoutTwigExtension:
        tags: ['twig.extension']

    Totoglu\SuluBlockSuiteBundle\Content\Type\BlockPropsPropertyResolver:
        tags: ['sulu.content.property_resolver']

    Totoglu\SuluBlockSuiteBundle\Content\Type\SingleReusableBlockSelectionPropertyResolver:
        arguments:
            $referenceStore: '@?sulu_http_cache.reference_store'
        tags: ['sulu.content.property_resolver']

    Totoglu\SuluBlockSuiteBundle\EventSubscriber\ReusableBlockCacheInvalidationSubscriber:
        arguments:
            $cacheManager: '@?sulu_http_cache.cache_manager'
            $presetProvider: '@?Totoglu\SuluBlockSuiteBundle\Preset\BlockPresetProviderInterface'
        tags: ['kernel.event_subscriber']

    Totoglu\SuluBlockSuiteBundle\Content\Type\HotspotPickerPropertyResolver:
        tags: ['sulu.content.property_resolver']

    Totoglu\SuluBlockSuiteBundle\Controller\Admin\ReusableBlockUsageController:
        arguments:
            $referenceRepository: '@?sulu_reference.reference_repository'
            $securityChecker: '@?sulu_security.security_checker'
        tags: ['controller.service_arguments']

    Totoglu\SuluBlockSuiteBundle\Admin\BlockSuiteAdmin:
        arguments:
            $referenceViewBuilderFactory: '@?sulu_reference.reference_list_view_builder_factory'
            $reusableBlocksEnabled: '%sulu_block_suite.reusable_blocks.enabled%'
            $presetsEnabled: '%sulu_block_suite.presets.enabled%'
            $layoutEnabled: '%sulu_block_suite.layout.enabled%'
        tags: ['sulu.admin']

    Totoglu\SuluBlockSuiteBundle\Metadata\TargetBlockOptionsFormMetadataVisitor:
        arguments:
            $schemaDirectory: '%sulu_block_suite.props.schema_dir%'
            $presetDirectory: '%sulu_block_suite.presets.yaml_dir%'
            $projectDirectory: '%kernel.project_dir%'
            $translator: '@?translator'
            $metadataProviderRegistry: '@?sulu_admin.metadata_provider_registry'
        tags:
            - { name: 'sulu_admin.form_metadata_visitor', priority: 50 }
            - { name: 'sulu_admin.typed_form_metadata_visitor', priority: 50 }

    Totoglu\SuluBlockSuiteBundle\DynamicContent\PageSourceResolverInterface:
        alias: Totoglu\SuluBlockSuiteBundle\DynamicContent\SuluPageSourceResolver

    Totoglu\SuluBlockSuiteBundle\DynamicContent\SuluPageSourceResolver:
        arguments:
            $pageRepository: '@?sulu_page.page_repository'
            $contentResolver: '@?sulu_content.content_resolver'
            $requestStack: '@?request_stack'

    Totoglu\SuluBlockSuiteBundle\DynamicContent\Provider\SuluArticleSourceProvider:
        arguments:
            $articleRepository: '@?sulu_article.article_repository'
            $contentResolver: '@?sulu_content.content_resolver'
            $requestStack: '@?request_stack'
        tags: ['sulu_block_suite.dynamic_source_provider']

    Totoglu\SuluBlockSuiteBundle\DynamicContent\Provider\SuluCategorySourceProvider:
        arguments:
            $categoryManager: '@?sulu_category.category_manager'
            $requestStack: '@?request_stack'
        tags: ['sulu_block_suite.dynamic_source_provider']

    Totoglu\SuluBlockSuiteBundle\DynamicContent\Provider\SuluMediaCollectionSourceProvider:
        arguments:
            $mediaManager: '@?sulu_media.media_manager'
            $requestStack: '@?request_stack'
        tags: ['sulu_block_suite.dynamic_source_provider']

    Totoglu\SuluBlockSuiteBundle\DynamicContent\DynamicContentHydratorInterface:
        alias: Totoglu\SuluBlockSuiteBundle\DynamicContent\DynamicContentHydrator

    Totoglu\SuluBlockSuiteBundle\DynamicContent\DynamicContentHydrator:
        arguments:
            $sourceResolver: '@Totoglu\SuluBlockSuiteBundle\DynamicContent\PageSourceResolverInterface'
            $customProviders: !tagged_iterator sulu_block_suite.dynamic_source_provider
            $targetFieldResolver: '@Totoglu\SuluBlockSuiteBundle\Metadata\BlockTargetFieldMetadataResolver'

    Totoglu\SuluBlockSuiteBundle\Transformer\BlockTransformPipelineInterface:
        alias: Totoglu\SuluBlockSuiteBundle\Transformer\BlockTransformPipeline

    Totoglu\SuluBlockSuiteBundle\Transformer\BlockTransformPipeline:
        arguments:
            $transformers: !tagged_iterator sulu_block_suite.block_transformer

    Totoglu\SuluBlockSuiteBundle\Transformer\DynamicContentTransformer:
        arguments:
            $hydrator: '@Totoglu\SuluBlockSuiteBundle\DynamicContent\DynamicContentHydratorInterface'
        tags: ['sulu_block_suite.block_transformer']

    Totoglu\SuluBlockSuiteBundle\Transformer\DefaultAttributesTransformer:
        tags: ['sulu_block_suite.block_transformer']

    Totoglu\SuluBlockSuiteBundle\Renderer\BlockRenderer:
        arguments:
            $twig: '@?twig'
            $pipeline: '@Totoglu\SuluBlockSuiteBundle\Transformer\BlockTransformPipelineInterface'
            $templateNamespaces: '%sulu_block_suite.rendering.template_namespaces%'
            $collectionRenderer: '@?Totoglu\SuluBlockSuiteBundle\Renderer\BlockCollectionRendererInterface'

    Totoglu\SuluBlockSuiteBundle\Renderer\DefaultBlockCollectionRenderer:
        arguments:
            $blockRenderer: '@Totoglu\SuluBlockSuiteBundle\Renderer\BlockRenderer'

    Totoglu\SuluBlockSuiteBundle\Renderer\BlockCollectionRendererInterface:
        alias: Totoglu\SuluBlockSuiteBundle\Renderer\DefaultBlockCollectionRenderer

    Totoglu\SuluBlockSuiteBundle\Twig\DynamicContentTwigExtension:
        arguments:
            $pipeline: '@Totoglu\SuluBlockSuiteBundle\Transformer\BlockTransformPipelineInterface'
            $blockRenderer: '@?Totoglu\SuluBlockSuiteBundle\Renderer\BlockRenderer'
        tags: ['twig.extension']

    Totoglu\SuluBlockSuiteBundle\Metadata\BlockTargetFieldMetadataResolver:
        arguments:
            $metadataProviderRegistry: '@?sulu_admin.metadata_provider_registry'
            $schemaDirectory: '%sulu_block_suite.props.schema_dir%'

    Totoglu\SuluBlockSuiteBundle\Controller\Admin\DynamicContentMetadataController:
        arguments:
            $sourceResolver: '@Totoglu\SuluBlockSuiteBundle\DynamicContent\PageSourceResolverInterface'
            $targetFieldResolver: '@Totoglu\SuluBlockSuiteBundle\Metadata\BlockTargetFieldMetadataResolver'
            $customProviders: !tagged_iterator sulu_block_suite.dynamic_source_provider
        tags: ['controller.service_arguments']

    Totoglu\SuluBlockSuiteBundle\Command\ExportBlockPresetsCommand:
        arguments:
            $yamlDirectory: '%sulu_block_suite.presets.yaml_dir%'
            $snippetRepository: '@?sulu_snippet.snippet_repository'
        tags: ['console.command']

    Totoglu\SuluBlockSuiteBundle\Search\BlockSuitePageReindexEnhancer:
        arguments:
            $snippetRepository: '@?sulu_snippet.snippet_repository'
        tags: ['sulu_page.website_page_reindex_provider_enhancer']

