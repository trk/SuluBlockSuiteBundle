name: "Tag, Release"

on:
  push:
    branches:
      - main
    paths:
      - "composer.json"
  workflow_dispatch:

jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo, xml, json
          tools: composer:v2

      - name: Extract version from composer.json
        id: get_version
        run: |
          VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'))->version ?? '';")

          if [ -z "$VERSION" ]; then
            echo "::error::Could not find 'version' field in composer.json"
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists on GitHub. Skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Pre-Release Quality Checks
        if: steps.check_release.outputs.exists == 'false'
        run: |
          composer validate --strict --no-check-version
          composer install --prefer-dist --no-interaction --no-progress
          vendor/bin/phpunit --colors=always
          vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress

      - name: Configure Git User
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Create Git Tag and GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          REPO=${{ github.repository }}
          echo "Processing Tag & Release for: $TAG"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
          fi

          if ! git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            git push origin "$TAG"
          fi

          # Custom Release Notes Generator
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --format="%H" $PREV_TAG..HEAD)
            COMPARE_URL="https://github.com/$REPO/compare/$PREV_TAG...$TAG"
          else
            COMMITS=$(git log --format="%H" HEAD)
            COMPARE_URL="https://github.com/$REPO/commits/$TAG"
          fi

          SEEN_AUTHORS=()
          CONTRIBUTORS_HTML=""

          for SHA in $COMMITS; do
             TITLE=$(git log --format="%s" -n 1 $SHA)
             SHORT_SHA=$(git rev-parse --short $SHA)
             
             LOGIN=$(gh api repos/$REPO/commits/$SHA --jq '.author.login // empty' 2>/dev/null || echo "")
             if [ -z "$LOGIN" ]; then
                LOGIN=$(git log --format="%an" -n 1 $SHA)
             fi
             AVATAR=$(gh api repos/$REPO/commits/$SHA --jq '.author.avatar_url // empty' 2>/dev/null || echo "")
             
             if [[ "$LOGIN" == *" "* ]]; then
               echo "* $TITLE by **$LOGIN** in $SHORT_SHA" >> release_notes.md
             else
               echo "* $TITLE by @$LOGIN in $SHORT_SHA" >> release_notes.md
             fi
             
             # Check if seen
             SEEN=false
             for SA in "${SEEN_AUTHORS[@]}"; do
                if [ "$SA" == "$LOGIN" ]; then
                   SEEN=true
                   break
                fi
             done
             
             if [ "$SEEN" = false ]; then
                SEEN_AUTHORS+=("$LOGIN")
                
                if [ -n "$AVATAR" ]; then
                   ITEM="<img src=\"$AVATAR\" width=\"24\" height=\"24\" style=\"border-radius: 50%; vertical-align: middle;\" alt=\"\"> $LOGIN"
                else
                   ITEM="$LOGIN"
                fi
                
                if [ -z "$CONTRIBUTORS_HTML" ]; then
                   CONTRIBUTORS_HTML="$ITEM"
                else
                   CONTRIBUTORS_HTML="$CONTRIBUTORS_HTML, $ITEM"
                fi
             fi
          done

          if [ -n "$CONTRIBUTORS_HTML" ]; then
            echo "" >> release_notes.md
            echo "### Contributors" >> release_notes.md
            echo "$CONTRIBUTORS_HTML" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "**Full Changelog**: $COMPARE_URL" >> release_notes.md

          gh release create $TAG -F release_notes.md --title "$TAG"
